name: no-secrets

# CI check: fail the build if any tracked file contains a hardcoded
# secret (SSH password, API key, etc.). Mirrors the local pre-commit
# hook so PRs can't sneak a leak past us.
on:
  push:
    branches: [main, master, develop, feat/**, fix/**, refactor/**]
  pull_request:
    branches: [main, master, develop]

jobs:
  scan:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scanner
        run: python scripts/check_no_secrets.py
