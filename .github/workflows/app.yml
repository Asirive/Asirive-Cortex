name: app

# The phone app: analyze + tests on every change, then an Android APK. On v4 the APK is published as cortex-ci.apk
# on the "app-beta" pre-release, signed with the runner's throwaway key. The gateway server picks it up, re-signs it
# with the permanent Cortex key (which never leaves that server: infra/deploy/apk_signer.py) and serves it at
#   https://infra.asirive.com/app/cortex.apk
on:
  push:
    branches: [v4]
    paths: ["apps/mobile/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"
  GATEWAY_URL: "https://infra.asirive.com"
  # the box's mTLS link to the gateway (playit TCP tunnel to the gateway's device listener)
  DEVICE_WS_URL: "wss://209.25.142.16:2613/ws/device"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the app-beta pre-release
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        # signed here with a throwaway key; the gateway server re-signs it with the permanent key
        # (infra/deploy/apk_signer.py), which never leaves that server
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=GATEWAY_URL=$GATEWAY_URL --dart-define=DEVICE_WS_URL=$DEVICE_WS_URL
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/cortex-ci.apk"
          sha256sum "$RUNNER_TEMP/cortex-ci.apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/cortex-ci.apk
          retention-days: 30
      - name: Publish app-beta pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-beta --yes --cleanup-tag || true
          gh release create app-beta "$RUNNER_TEMP/cortex-ci.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Cortex app (beta build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7} on v4 (gateway $GATEWAY_URL). cortex-ci.apk is signed with a throwaway key: do not install it. Install https://infra.asirive.com/app/cortex.apk, the same build signed with the Cortex key by the gateway server a few minutes later."
