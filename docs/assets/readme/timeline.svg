<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Two clocks. Obstacle: about 111 ms from ToF frame to vibration. Question: about 150 ms from end of speech to first token, about 0.6 s to first sound. Budget 1 second.">
  <rect width="960" height="340" rx="18" fill="#000"/>
  <text x="32" y="44" fill="#EAFF00" font-size="20" font-weight="700" letter-spacing="2">TWO CLOCKS</text>
  <text x="32" y="68" fill="#8a8a8a" font-size="13">0 to 1000 ms, to scale. Neither clock waits for the other.</text>

  <!-- tracks (background) : x 200..920 = 1000 ms, 0.72 px/ms -->
  <rect x="200" y="100" width="720" height="30" rx="4" fill="#141414"/>
  <rect x="200" y="196" width="720" height="30" rx="4" fill="#141414"/>
  <line x1="920" y1="92" x2="920" y2="282" stroke="#EAFF00" stroke-dasharray="4 4"/>

  <!-- obstacle 66 + 5 + 40 -->
  <text x="32" y="114" fill="#fff" font-size="14" font-weight="700">OBSTACLE</text>
  <text x="32" y="132" fill="#8a8a8a" font-size="11">safety, cpu0</text>
  <rect x="200" y="100" width="47.5" height="30" fill="#EAFF00"/>
  <rect x="247.5" y="100" width="3.6" height="30" fill="#fff"/>
  <rect x="251.1" y="100" width="28.8" height="30" fill="#9aa800"/>
  <text x="300" y="120" fill="#EAFF00" font-size="13" font-weight="700">≈ 111 ms to the skin</text>
  <text x="200" y="154" fill="#bbb" font-size="11">ToF frame 66 ms · USB 5 ms · motor spin-up 40 ms</text>

  <!-- question: 150 first token, 620 first sound -->
  <text x="32" y="210" fill="#fff" font-size="14" font-weight="700">QUESTION</text>
  <text x="32" y="228" fill="#8a8a8a" font-size="11">Cortex-EmbD</text>
  <rect x="200" y="196" width="108" height="30" fill="#EAFF00"/>
  <rect x="308" y="196" width="338" height="30" fill="#fff"/>
  <text x="662" y="216" fill="#EAFF00" font-size="13" font-weight="700">≈ 0.6 s first sound</text>
  <text x="200" y="250" fill="#bbb" font-size="11"><tspan fill="#EAFF00">■</tspan> end of speech → first token ~150 ms</text>
  <text x="200" y="268" fill="#bbb" font-size="11"><tspan fill="#fff">■</tspan> first audio frames + speaker prebuffer</text>

  <g fill="#666" font-size="11" text-anchor="middle">
    <text x="200" y="300">0</text><text x="380" y="300">250</text><text x="560" y="300">500</text><text x="740" y="300">750</text>
  </g>
  <text x="926" y="300" fill="#EAFF00" font-size="11" text-anchor="end">1 s budget</text>
  <text x="32" y="326" fill="#666" font-size="11">Sources: docs/measurements/2026-11-safety-sim.md (simulated sensor) · docs/architecture/CORTEX-ENGINE.md (box)</text>
</svg>
