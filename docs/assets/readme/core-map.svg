<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Cortex-EmbD core map: cpu0 reserved for safety; cpu1-3 hearing, speech codec and speaker; cpu4-7 the language model; Hexagon NPU the vision encoder">
  <rect width="960" height="430" rx="18" fill="#000"/>
  <text x="32" y="44" fill="#EAFF00" font-size="20" font-weight="700" letter-spacing="2">CORTEX-EMBD · ONE CHIP, NO WAITING</text>
  <text x="32" y="68" fill="#8a8a8a" font-size="13">Snapdragon SC8280XP on the Radxa Dragon Q8B. Every core has one owner.</text>

  <!-- cpu0 -->
  <rect x="32" y="96" width="140" height="206" rx="10" fill="#EAFF00"/>
  <text x="102" y="126" text-anchor="middle" fill="#000" font-size="13" font-weight="700">cpu0</text>
  <text x="102" y="194" text-anchor="middle" fill="#000" font-size="20" font-weight="800">SAFETY</text>
  <text x="102" y="226" text-anchor="middle" fill="#000" font-size="11">SCHED_FIFO</text>
  <text x="102" y="242" text-anchor="middle" fill="#000" font-size="11">memory locked</text>
  <text x="102" y="258" text-anchor="middle" fill="#000" font-size="11">no model, no net</text>

  <!-- cpu1-3 group -->
  <rect x="192" y="96" width="236" height="206" rx="10" fill="#141414" stroke="#EAFF00" stroke-width="1.5"/>
  <g fill="#000" stroke="#EAFF00" stroke-width="1">
    <rect x="206" y="108" width="64" height="28" rx="6"/><rect x="278" y="108" width="64" height="28" rx="6"/><rect x="350" y="108" width="64" height="28" rx="6"/>
  </g>
  <g fill="#EAFF00" font-size="12" font-weight="700" text-anchor="middle">
    <text x="238" y="127">cpu1</text><text x="310" y="127">cpu2</text><text x="382" y="127">cpu3</text>
  </g>
  <text x="310" y="184" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">EARS + MOUTH</text>
  <text x="310" y="216" text-anchor="middle" fill="#bbb" font-size="11">mic → VAD → voice encoder</text>
  <text x="310" y="234" text-anchor="middle" fill="#bbb" font-size="11">codec + speaker on cpu3</text>
  <text x="310" y="252" text-anchor="middle" fill="#bbb" font-size="11">vision islands mid-answer</text>

  <!-- cpu4-7 group -->
  <rect x="448" y="96" width="300" height="206" rx="10" fill="#1f1f1f" stroke="#fff" stroke-width="1.5"/>
  <g fill="#000" stroke="#fff" stroke-width="1">
    <rect x="460" y="108" width="62" height="28" rx="6"/><rect x="532" y="108" width="62" height="28" rx="6"/>
    <rect x="604" y="108" width="62" height="28" rx="6"/><rect x="676" y="108" width="62" height="28" rx="6"/>
  </g>
  <g fill="#fff" font-size="12" font-weight="700" text-anchor="middle">
    <text x="491" y="127">cpu4</text><text x="563" y="127">cpu5</text><text x="635" y="127">cpu6</text><text x="707" y="127">cpu7</text>
  </g>
  <text x="598" y="184" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">THE LANGUAGE MODEL</text>
  <text x="598" y="216" text-anchor="middle" fill="#bbb" font-size="11">LFM3-Omni-2B Q4_0 · X1C cores</text>
  <text x="598" y="234" text-anchor="middle" fill="#bbb" font-size="11">hears, sees, speaks, calls tools</text>
  <text x="598" y="252" text-anchor="middle" fill="#bbb" font-size="11">first token ~115 ms</text>

  <!-- NPU -->
  <rect x="768" y="96" width="160" height="206" rx="10" fill="#0d0d0d" stroke="#EAFF00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="848" y="127" text-anchor="middle" fill="#EAFF00" font-size="12" font-weight="700">HEXAGON NPU</text>
  <text x="848" y="184" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">EYES</text>
  <text x="848" y="216" text-anchor="middle" fill="#bbb" font-size="11">vision encoder</text>
  <text x="848" y="234" text-anchor="middle" fill="#bbb" font-size="11">7 QNN segments</text>
  <text x="848" y="252" text-anchor="middle" fill="#bbb" font-size="11">282 ms / view</text>

  <!-- footer -->
  <rect x="32" y="326" width="896" height="74" rx="10" fill="#111"/>
  <text x="52" y="356" fill="#EAFF00" font-size="13" font-weight="700">WHY</text>
  <text x="100" y="356" fill="#ddd" font-size="13">The AI can load every other core and the obstacle warning still runs on time.</text>
  <text x="100" y="380" fill="#8a8a8a" font-size="12">Measured on the box · docs/architecture/CORTEX-ENGINE.md</text>
</svg>
