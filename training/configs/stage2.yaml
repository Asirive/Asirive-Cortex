# Stage 2: Video Extension Config
# Temporal video clips + ambient audio

model:
  vision_tower: "mobileclip_s2"
  audio_tower:
    channels: [1, 32, 64, 128]
    kernels: [3, 3, 3]
    strides: [[2,2], [2,2], [2,1]]
  fusion:
    type: mamba2
    d_model: 512
    d_state: 64
    d_conv: 4
    expand: 2
    n_layer: 12
  text_embedder:
    vocab_size: 32000
    proj_dim: 512
  num_tools: 14
  freeze_vision: false  # unfreeze projector
  freeze_audio: true

training:
  batch_size: 128
  num_workers: 16
  max_epochs: 3
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 2000
  gradient_clip: 1.0
  mixed_precision: true
  compile: true
  output_dir: "outputs/stage2/"

data:
  video_root: "data/ego4d_clips/"
  caption_file: "data/ego4d_captions.json"
  num_frames: 4

audio:
  sample_rate: 16000
  n_mels: 80
  hop_length: 160
  win_length: 400
  n_fft: 512

video:
  resolution: [224, 224]
  fps: 2
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
