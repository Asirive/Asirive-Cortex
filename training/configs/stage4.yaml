# Stage 4: Teacher Distillation Config
# Cortex + Gemini captured data

model:
  vision_tower: "mobileclip_s2"
  audio_tower:
    channels: [1, 32, 64, 128]
    kernels: [3, 3, 3]
    strides: [[2,2], [2,2], [2,1]]
  fusion:
    type: mamba2
    d_model: 512
    d_state: 64
    d_conv: 4
    expand: 2
    n_layer: 12
  text_embedder:
    vocab_size: 32000
    proj_dim: 512
  num_tools: 14
  freeze_vision: false
  freeze_audio: false

training:
  batch_size: 64
  num_workers: 16
  max_epochs: 5
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  gradient_clip: 1.0
  mixed_precision: true
  compile: true
  output_dir: "outputs/stage4/"

data:
  data_root: "data/cortex_teacher_distill/"
  min_whisper_confidence: 0.9
  min_bleu: 0.6

audio:
  sample_rate: 16000
  n_mels: 80
  hop_length: 160
  win_length: 400
  n_fft: 512

video:
  resolution: [224, 224]
  fps: 2
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
