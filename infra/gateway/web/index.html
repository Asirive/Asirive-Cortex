<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Cortex Fleet Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: black console. Top bar, "what needs me" strip, summary, then fleet table with a detail drawer
   (full-screen sheet on phones). Brand: Asirive black + #EAFF00. Yellow is the only accent; status colors are semantic. */
:root {
  --bg: #0a0a0a; --panel: #121212; --panel-2: #181818; --line: #262626;
  --fg: #f2f2ee; --muted: #9a9a93; --accent: #eaff00; --accent-ink: #0a0a0a;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --idle: #8a8a84;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 14px; line-height: 1.45; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 28px; height: 28px; display: block; }
.brand b { font-weight: 800; letter-spacing: .14em; font-size: 13px; text-transform: uppercase; }
.brand span { color: var(--muted); letter-spacing: .14em; font-size: 11px; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; margin-left: 12px; flex-wrap: wrap; }
.tab { background: none; border: 0; padding: 11px 12px; color: var(--muted); letter-spacing: .08em; font-size: 12px; text-transform: uppercase; font-weight: 600; border-bottom: 2px solid transparent; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.spacer { flex: 1; }
.conn { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.conn.bad { color: var(--bad); }
.demo-flag { background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 11px; letter-spacing: .1em; padding: 2px 8px; text-transform: uppercase; }

.need { margin: 18px 0 0; padding: 12px 16px; border: 1px solid var(--line); background: var(--panel); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.need.alert { border-color: var(--warn); }
.need b { font-size: 16px; }
.need .why { color: var(--muted); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 12px 0 18px; }
.stat { background: var(--panel); padding: 14px 16px; min-width: 0; }
.stat h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat .big { font-family: var(--mono); font-size: 28px; font-weight: 500; line-height: 1.1; }
.stat .big small { font-size: 14px; color: var(--muted); }
.stat .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.bars { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.bar { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; }
.bar i { display: block; height: 6px; background: #1f1f1f; position: relative; }
.bar i u { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
@media (max-width: 700px) { .summary { grid-template-columns: 1fr 1fr; } }

.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); padding: 8px 12px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
input[type=search], input[type=password], input[type=text], select { background: var(--panel); border: 1px solid var(--line); color: var(--fg); padding: 9px 10px; font: inherit; min-width: 0; min-height: 40px; }
input::placeholder { color: var(--muted); }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; padding-bottom: 40px; }
.main.has-detail { grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); }
@media (max-width: 900px) { .main.has-detail { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid #1c1c1c; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
tbody tr.sel { background: #1a1d05; box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.off td { color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; background: var(--idle); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.idle { background: transparent; border: 2px solid var(--idle); }
.status { font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.lbl { color: var(--muted); max-width: 18ch; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
.tier { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 2px 7px; border: 1px solid var(--line); }
.tier.ALPHA { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tier.BETA { color: var(--fg); border-color: #555; }
.tier.STABLE { color: var(--muted); }
.batt { display: inline-flex; align-items: center; gap: 6px; }
.batt i { width: 26px; height: 9px; border: 1px solid #777; position: relative; display: inline-block; }
.batt i u { position: absolute; inset: 1px auto 1px 1px; background: var(--ok); }
.batt.low i u { background: var(--bad); }
.empty { padding: 40px 16px; color: var(--muted); text-align: center; }
@media (max-width: 700px) {
  .tablewrap { border: 0; background: none; overflow: visible; }
  table, tbody { display: block; } thead { display: none; }
  tbody tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 12px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 8px; }
  td { display: block; padding: 0; border: 0; white-space: normal; }
  td[data-l]::before { content: attr(data-l); display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  td.full { grid-column: 1 / -1; }
  td.hm { display: none; }
}

.drawer { border: 1px solid var(--line); background: var(--panel); position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.drawer:focus { outline: none; }
@media (max-width: 900px) {
  .drawer { position: fixed; inset: 0; max-height: none; z-index: 15; border: 0;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
}
.dh { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--panel); z-index: 2; flex-wrap: wrap; }
.dh h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .04em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.x { background: none; border: 1px solid var(--line); min-width: 44px; min-height: 44px; color: var(--fg); }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sec h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kv div { min-width: 0; }
.kv span { display: block; font-size: 11px; color: var(--muted); }
.kv b { font-family: var(--mono); font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
.stale .kv b { color: var(--muted); }
.logbox { background: #0d0d0d; border: 1px solid var(--line); max-height: 220px; overflow: auto; padding: 8px 10px; font-family: var(--mono); font-size: 12px; }
.logbox div { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; }
.lv-ERROR { color: var(--bad); } .lv-WARN { color: var(--warn); } .lv-DEBUG { color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.timeline li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.timeline time { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: transparent; border: 1px solid var(--fg); padding: 9px 14px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; min-height: 40px; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:hover, .btn.danger.armed { background: var(--bad); color: var(--bg); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.locked { border: 1px dashed #444; padding: 10px 12px; font-size: 12px; color: var(--muted); }
.progress { height: 6px; background: #1f1f1f; margin: 6px 0; }
.progress u { display: block; height: 100%; background: var(--accent); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; font-weight: 700; font-size: 13px; z-index: 30; max-width: 90vw; }
.toast.err { background: var(--bad); }

.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.ring { border: 1px solid var(--line); background: var(--panel); }
.ring header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
.ring header h2 { margin: 0; font-size: 16px; letter-spacing: .1em; font-weight: 800; }
.ring header span { color: var(--muted); font-size: 12px; }
.vrow { display: grid; grid-template-columns: 1fr 40px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13px; }
.h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; font-weight: 600; }
.rel { border: 1px solid var(--line); background: var(--panel); margin-bottom: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
.rel h3 { margin: 0; font-size: 15px; font-family: var(--mono); font-weight: 500; overflow-wrap: anywhere; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 2px 8px; border: 1px solid var(--line); margin-left: 8px; }
.pill.ROLLING { border-color: var(--accent); color: var(--accent); } .pill.HALTED { border-color: var(--bad); color: var(--bad); } .pill.COMPLETE { border-color: var(--ok); color: var(--ok); }
.stages { display: flex; gap: 3px; margin: 8px 0 4px; }
.stages i { flex: 1; height: 6px; background: #222; } .stages i.done { background: var(--ok); } .stages i.cur { background: var(--accent); }
@media (max-width: 700px) { .rel { grid-template-columns: 1fr; } }

.panel { border: 1px solid var(--line); background: var(--panel); margin-bottom: 16px; }
.panel .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; padding: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding-bottom: 9px; min-width: 0; }
.check input { width: 18px; height: 18px; }
.code { font-family: var(--mono); font-size: 34px; letter-spacing: .14em; color: var(--accent); padding: 6px 0; overflow-wrap: anywhere; }
.claim { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.claim img { width: 168px; height: 168px; background: #fff; padding: 8px; image-rendering: pixelated; }
.steps { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }

.gate { max-width: 460px; margin: 12vh auto; border: 1px solid var(--line); background: var(--panel); padding: 28px; }
.gate h1 { margin: 12px 0 6px; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
.gate p { color: var(--muted); margin: 0 0 16px; }
.gate form { display: flex; flex-direction: column; gap: 10px; }
table.audit td, table.fb td { white-space: normal; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
"use strict";
var LOGO = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#eaff00"/><rect x="20" y="20" width="20" height="40" fill="#000"/><rect x="20" y="70" width="20" height="10" fill="#000"/><rect x="60" y="40" width="20" height="40" fill="#000"/><rect x="60" y="20" width="20" height="10" fill="#000"/><rect x="40" y="40" width="20" height="20" fill="#000"/></svg>';

var S = { token: "", demo: false, devices: [], releases: [], audit: [], feedback: [], tab: "fleet", tier: "ALL", status: "ALL", q: "", sel: null, detail: null,
  err: "", lastOk: 0, level: "INFO", reg: null, armed: "", relErr: "" };
var $app = document.getElementById("app"), timer = null, armTimer = null;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function ago(ms) { if (!ms) return "never"; var s = Math.max(0, Math.round((Date.now() - ms) / 1000)); if (s < 60) return s + "s ago"; if (s < 3600) return Math.round(s / 60) + "m ago"; if (s < 86400) return Math.round(s / 3600) + "h ago"; return Math.round(s / 86400) + "d ago"; }
function up(s) { var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + "h " + m + "m" : m + "m " + (s % 60) + "s"; }
function clock(ms) { var d = new Date(ms), t = d.toTimeString().slice(0, 8); return new Date().toDateString() === d.toDateString() ? t : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + t; }
function isLive(d) { return d.reg_state !== "PENDING" && d.reg_state !== "REVOKED"; }
function health(d) {
  if (d.reg_state === "PENDING") return { k: "off", label: "Awaiting claim", dot: "idle" };
  if (d.reg_state === "REVOKED") return { k: "off", label: "Revoked", dot: "bad" };
  if (d.reg_state === "CLAIMED" && !d.last_seen_ms) return { k: "off", label: "Claimed, not connected yet", dot: "idle" };
  if (d.safety === "FAULT") return { k: "bad", label: d.online ? "Safety fault" : "Offline after safety fault", dot: "bad" };
  if (!d.online) return { k: d.attention ? "warn" : "off", label: "Offline", dot: d.attention ? "warn" : "" };
  if (d.safety === "DEGRADED") return { k: "warn", label: "Degraded", dot: "warn" };
  if (d.attention) return { k: "warn", label: d.attention, dot: "warn" };
  return { k: "ok", label: "Healthy", dot: "ok" };
}

/* ---------- data ---------- */
function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: "Bearer " + S.token }, opts.headers || {});
  return fetch(path, opts).then(function (r) {
    return r.text().then(function (t) {
      var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (!r.ok) { var e = new Error((j && j.error) || (r.status === 401 ? "Token rejected" : "Gateway error " + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}
function refresh() {
  if (S.demo) { demoTick(); return render(); }
  Promise.all([api("/api/devices"), api("/api/releases"), api("/api/audit"), api("/api/feedback")]).then(function (r) {
    S.devices = r[0] || []; S.releases = r[1] || []; S.audit = r[2] || []; S.feedback = r[3] || []; S.err = ""; S.lastOk = Date.now();
    if (S.sel) return api("/api/devices/" + encodeURIComponent(S.sel)).then(function (d) { S.detail = d; }).catch(function (e) { if (e.status === 404) { S.sel = null; S.detail = null; } else throw e; });
  }).catch(function (e) { S.err = e.message; if (e.status === 401) logout(); }).then(render);
}
function start() { if (!S.demo) api("/api/whoami").then(function (w) { S.me = w; render(); }).catch(function () {}); refresh(); clearInterval(timer); timer = setInterval(refresh, 3000); }
function logout() { clearInterval(timer); S.token = ""; S.me = null; S.demo = false; S.sel = null; S.detail = null; try { sessionStorage.removeItem("cortex-token"); } catch (e) {} render(); }

/* ---------- demo data (marked, used when no gateway is reachable) ---------- */
var DEMO = null;
function demoInit() {
  var now = Date.now(), rnd = function (a, b) { return a + Math.floor(Math.random() * (b - a)); };
  var mk = function (id, tier, label, fw, online, safety) {
    return { id: id, label: label, tier: tier, ring: tier, bench: tier === "ALPHA", hardware: "dragon-q8b", firmware: fw, mcu: "0.2.1", model: "lfm3-omni-2b-q4", online: online, reg_state: "CLAIMED",
      last_seen_ms: online ? now - rnd(0, 4000) : now - rnd(120000, 900000), connected_ms: now - rnd(600000, 9000000), battery_pct: rnd(14, 98), charging: false, mic_muted: false,
      safety: safety, brain: "LOCAL", link: "USB_TETHER", link_rtt_ms: rnd(28, 90), uptime_s: rnd(900, 40000), soc_temp_c: 48 + Math.random() * 14,
      power_w: 3 + Math.random() * 3, mem_used_mb: rnd(4200, 5900), services_restarted: 0, safety_latency_p99_ms: rnd(42, 84), heartbeat_interval_s: 5 };
  };
  var ds = [mk("ALPHA-0001", "ALPHA", "Bench unit 1", "4.0.0-alpha.3", true, "OK"), mk("ALPHA-0002", "ALPHA", "Bench unit 2", "4.0.0-alpha.3", true, "OK"),
    mk("ALPHA-0003", "ALPHA", "Bench unit 3", "4.0.0-alpha.2", true, "DEGRADED"), mk("ALPHA-0004", "ALPHA", "Haziq's pair", "4.0.0-alpha.3", false, "OK"),
    mk("BETA-0001", "BETA", "Tester Aisha", "4.0.0-beta.1", true, "OK"), mk("BETA-0002", "BETA", "Tester Ben", "4.0.0-beta.1", true, "OK"),
    mk("BETA-0003", "BETA", "Tester Chen", "4.0.0-beta.1", false, "FAULT"), mk("STBL-0001", "STABLE", "Customer 1", "3.9.4", true, "OK"), mk("STBL-0002", "STABLE", "Customer 2", "3.9.4", true, "OK")];
  ds[1].brain = "CLOUD"; ds[2].services_restarted = 2;
  ds[2].ota = { release_id: "r-2026.10.30", stage: "DOWNLOADING", percent: 42 };
  DEMO = { devices: ds, audit: [{ ts_ms: now - 600000, actor: "dev-admin", action: "command:set_log_level", target: "ALPHA-0001", result: "sent" }],
    releases: [{ release_id: "r-2026.10.30", state: "ROLLING", stage: 0, stages: 6, ring: "RING_ALPHA", percent: 100, offered: 3, committed: 2, failed: 0, counter: 5, max_ring: "RING_STABLE", version: "4.0.1", note: "waiting: 2 of 3 offered devices committed" }] };
}
function demoAttention(d) {
  if (d.reg_state === "PENDING" || d.reg_state === "REVOKED") return "";
  if (d.safety === "FAULT" || d.safety === "DEGRADED") return "Safety " + d.safety.toLowerCase() + " (last known)";
  if (!d.online && d.last_seen_ms) return "Offline";
  if (d.online && d.battery_pct < 15) return "Low battery";
  return "";
}
function demoTick() {
  if (!DEMO) demoInit();
  var now = Date.now();
  DEMO.devices.forEach(function (d) {
    if (d.online) { d.last_seen_ms = now - Math.floor(Math.random() * 3000); d.uptime_s += 3; d.link_rtt_ms = 28 + Math.floor(Math.random() * 60); d.soc_temp_c = Math.max(44, Math.min(66, d.soc_temp_c + (Math.random() - .5))); }
    if (d.ota && d.ota.percent < 100) { d.ota.percent = Math.min(100, d.ota.percent + 3); if (d.ota.percent === 100) { d.ota.stage = "DONE"; d.ota.outcome = "COMMITTED"; } }
    d.attention = demoAttention(d);
  });
  S.devices = DEMO.devices.map(function (d) { return Object.assign({}, d); }); S.audit = DEMO.audit; S.releases = DEMO.releases; S.feedback = []; S.lastOk = now; S.err = "";
  if (S.sel) {

function viewFeedback() {
  var rows = (S.feedback || []).slice().reverse().map(function (f) { return '<tr><td class="mono">' + clock(f.ts_ms) + '</td><td class="mono">' + esc(f.device_id) + '</td><td>' + esc(f.tier) + '</td><td>' + esc(f.text) + '</td><td class="mono">' + esc(f.app_version) + '</td></tr>'; }).join("");
  return '<div class="tablewrap" style="margin-bottom:40px"><table class="fb"><thead><tr><th scope="col">Time</th><th scope="col">Device</th><th scope="col">Tier</th><th scope="col">Feedback</th><th scope="col">App</th></tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="empty">No feedback yet. Users send it from the app; text and trimmed logs only.</td></tr>') + '</tbody></table></div>';
}
function viewGate() {
  return '<main class="gate"><div class="brand">' + LOGO + '<b>Asirive</b></div><h1>Cortex Fleet Console</h1><p>Enter your personal access token. Ask an admin if you do not have one.</p>' +
    '<form id="login"><label class="sr" for="tok">Gateway token</label><input type="password" id="tok" placeholder="Gateway token" autocomplete="current-password"><div class="err" id="err" role="alert">' + esc(S.err) + '</div>' +
    '<button class="btn primary" type="submit">Open console</button><button class="btn" type="button" id="demo">View with demo data</button></form></main>';
}
var TABS = [["fleet", "Fleet"], ["rings", "Updates"], ["feedback", "Feedback"], ["audit", "Audit"]];
function render() {
  var snap = snapshot();
  if (!S.token) { $app.innerHTML = viewGate(); bindGate(); return; }
  var live = S.err ? '<span class="dot bad" aria-hidden="true"></span>' + esc(S.err) + (S.lastOk ? " · showing data from " + ago(S.lastOk) : "") : '<span class="dot ok" aria-hidden="true"></span>Live · updated ' + ago(S.lastOk);
  $app.innerHTML = '<header class="top"><div class="brand">' + LOGO + '<b>Asirive</b><span>Cortex Fleet</span></div>' +
    '<nav class="tabs" role="tablist" aria-label="Sections">' + TABS.map(function (t) { return '<button class="tab" role="tab" id="tab-' + t[0] + '" aria-controls="panel" data-tab="' + t[0] + '" data-fk="tab-' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join("") + '</nav>' +
    '<span class="spacer"></span>' + (S.tab === "fleet" ? '<button class="btn primary" id="regbtn">Register device</button>' : "") + (S.demo ? '<span class="demo-flag">Demo data</span>' : "") + '<div class="conn' + (S.err ? " bad" : "") + '">' + live + '</div><span class="demo-flag" title="Your role decides what you can change">' + (S.me ? esc(S.me.name) + " · " + esc(S.me.role) : "") + '</span><button class="btn" id="out">Sign out</button></header>' +
    '<main id="panel" role="tabpanel" aria-labelledby="tab-' + S.tab + '"><h1 class="sr">Cortex fleet console</h1>' + viewNeed() + viewSummary() + (S.tab === "fleet" ? viewFleet() : S.tab === "rings" ? viewRings() : S.tab === "feedback" ? viewFeedback() : viewAudit()) + '</main>';
  bind(); restore(snap);
  var lv = document.getElementById("live"); if (lv && S.err !== lv.dataset.e) { lv.dataset.e = S.err; lv.textContent = S.err ? "Connection problem: " + S.err : ""; }
}
function toast(m, err) { var t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }

/* Re-rendering must not cost the operator their place: keep focus, caret, scroll positions. */
function snapshot() {
  var a = document.activeElement, snap = { scroll: {}, win: window.scrollY };
  if (a && a !== document.body && $app.contains(a)) { snap.fk = a.getAttribute("data-fk"); snap.id = a.id; if (typeof a.selectionStart === "number") { snap.s = a.selectionStart; snap.e = a.selectionEnd; } }
  ["drawer", "logbox", "tablewrap"].forEach(function (c) { var el = document.querySelector("." + c + ", #" + c); if (el) snap.scroll[c] = el.scrollTop; });
  var lb = document.getElementById("logbox"); if (lb) snap.logAtBottom = lb.scrollTop + lb.clientHeight >= lb.scrollHeight - 4;
  return snap;
}
function restore(snap) {
  ["drawer", "logbox", "tablewrap"].forEach(function (c) { var el = document.querySelector("." + c + ", #" + c); if (el && snap.scroll[c] != null) el.scrollTop = snap.scroll[c]; });
  window.scrollTo(0, snap.win);
  var el = snap.id ? document.getElementById(snap.id) : null;
  if (!el && snap.fk) el = $app.querySelector('[data-fk="' + snap.fk + '"]');
  if (el) { el.focus({ preventScroll: true }); if (snap.s != null && el.setSelectionRange) try { el.setSelectionRange(snap.s, snap.e); } catch (x) {} }
}
function arm(key) { S.armed = key; clearTimeout(armTimer); armTimer = setTimeout(function () { S.armed = ""; render(); }, 5000); render(); }
function openDevice(id) { S.sel = id; S.detail = null; refresh(); setTimeout(function () { var d = document.querySelector(".drawer"); if (d) d.focus({ preventScroll: true }); }, 60); }
function closeDevice() { var id = S.sel; S.sel = null; S.detail = null; render(); var r = id && $app.querySelector('[data-fk="row-' + id + '"]'); if (r) r.focus(); }

/* ---------- events ---------- */
function bindGate() {
  document.getElementById("demo").onclick = enterDemo;
  document.getElementById("login").onsubmit = function (e) {
    e.preventDefault(); var v = document.getElementById("tok").value.trim(); if (!v) return;
    S.token = v; S.err = ""; try { sessionStorage.setItem("cortex-token", v); } catch (x) {} start();
  };
}
function bind() {
  $app.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { S.tab = b.dataset.tab; render(); }; b.onkeydown = function (e) { var i = TABS.map(function (t) { return t[0]; }).indexOf(b.dataset.tab), n = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : null; if (n != null) { S.tab = TABS[(n + TABS.length) % TABS.length][0]; render(); var t = document.getElementById("tab-" + S.tab); if (t) t.focus(); } }; });
  $app.querySelectorAll("[data-group]").forEach(function (b) { b.onclick = function () { S[b.dataset.group] = b.dataset.val; if (b.dataset.fk === "need-show") S.tab = "fleet"; render(); }; });
  $app.querySelectorAll("[data-level]").forEach(function (b) { b.onclick = function () { S.level = b.dataset.level; render(); }; });
  $app.querySelectorAll("tbody tr[data-id]").forEach(function (r) {
    r.onclick = function () { openDevice(r.dataset.id); };
    r.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDevice(r.dataset.id); } };
  });
  $app.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = closeDevice; });
  var q = document.getElementById("q"); if (q) q.oninput = function () { S.q = q.value; render(); };
  document.getElementById("out").onclick = logout;
  var rb = document.getElementById("regbtn"); if (rb) rb.onclick = function () { if (S.reg && S.reg.result) { var p = document.getElementById("regpanel"); if (p) p.focus(); toast("Save the claim code first, then press Done"); return; } S.reg = S.reg ? null : { tier: "ALPHA", bench: true, label: "" }; render(); if (S.reg) { var l = document.getElementById("rlabel"); if (l) l.focus(); } };
  var rf = document.getElementById("regform");
  if (rf) {
    var lab = document.getElementById("rlabel"), tier = document.getElementById("rtier"), bench = document.getElementById("rbench");
    lab.oninput = function () { S.reg.label = lab.value; S.reg.err = ""; };
    bench.onchange = function () { S.reg.bench = bench.checked; };
    document.getElementById("regcancel").onclick = function () { S.reg = null; render(); };
    tier.onchange = function () { S.reg.tier = tier.value; S.reg.bench = tier.value === "ALPHA"; render(); };
    rf.onsubmit = function (e) {
      e.preventDefault();
      var body = { label: lab.value.trim(), tier: tier.value, bench: tier.value === "ALPHA" && bench.checked };
      if (!body.label) { S.reg.err = "Give the device a label so you can find it later."; render(); document.getElementById("rlabel").focus(); return; }
      var done = function (res) { S.reg = { result: res, label: body.label }; refresh(); setTimeout(function () { var p = document.getElementById("regpanel"); if (p) p.focus(); }, 60); };
      if (S.demo) { demoRegister(body, done); return; }
      api("/api/registrations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
        .then(function (r) { done({ id: r.registration.id, code: r.claim_code, qr: r.claim_qr_png }); }).catch(function (er) { S.reg.err = er.message; render(); });
    };
  }
  var cd = document.getElementById("regdone"); if (cd) cd.onclick = function () { S.reg = null; render(); };
  var cc = document.getElementById("copycode"); if (cc) cc.onclick = function () {
    var t = document.getElementById("claimcode").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("Code copied"); }).catch(function () { var r = document.createRange(); r.selectNodeContents(document.getElementById("claimcode")); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected. Press Ctrl+C or Cmd+C to copy"); });
  };
  $app.querySelectorAll("[data-revoke]").forEach(function (b) {
    b.onclick = function () {
      if (S.armed !== b.dataset.key) return arm(b.dataset.key);
      S.armed = "";
      if (S.demo) { demoRevoke(S.sel); toast("Demo: revoked " + S.sel); refresh(); return; }
      api("/api/registrations/" + encodeURIComponent(S.sel) + "/revoke", { method: "POST" }).then(function () { toast("Revoked " + S.sel); refresh(); }).catch(function (e) { toast("Not revoked: " + e.message, true); refresh(); });
    };
  });
  $app.querySelectorAll("[data-cmd]").forEach(function (b) {
    b.onclick = function () {
      var name = b.dataset.cmd, arg = b.dataset.arg;
      if (b.dataset.danger && S.armed !== b.dataset.key) return arm(b.dataset.key);
      S.armed = "";
      if (S.demo) { toast("Demo mode: no command sent"); render(); return; }
      var args = name === "restart_service" ? { service: arg } : name === "set_log_level" ? { level: arg } : {};
      api("/api/devices/" + encodeURIComponent(S.sel) + "/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name, args: args }) })
        .then(function () { toast("Sent " + name + " to " + S.sel + ". The result appears under Debug commands."); refresh(); setTimeout(refresh, 1500); }).catch(function (e) { toast("Not sent: " + e.message, true); refresh(); });
    };
  });
  $app.querySelectorAll("[data-halt]").forEach(function (b) {
    b.onclick = function () {
      if (S.armed !== b.dataset.key) return arm(b.dataset.key);
      S.armed = "";
      if (S.demo) { DEMO.releases.forEach(function (r) { if (r.release_id === b.dataset.halt) { r.state = "HALTED"; r.halt_why = "halted by operator"; } }); refresh(); return; }
      api("/api/releases/" + encodeURIComponent(b.dataset.halt) + "/halt", { method: "POST" }).then(function () { toast("Halted " + b.dataset.halt); refresh(); }).catch(function (e) { toast("Not halted: " + e.message, true); });
    };
  });
  $app.querySelectorAll("[data-resume]").forEach(function (b) {
    b.onclick = function () {
      if (S.demo) { DEMO.releases.forEach(function (r) { if (r.release_id === b.dataset.resume) { r.state = "ROLLING"; r.halt_why = ""; } }); refresh(); return; }
      api("/api/releases/" + encodeURIComponent(b.dataset.resume) + "/resume", { method: "POST" }).then(function () { toast("Resumed " + b.dataset.resume); refresh(); }).catch(function (e) { toast("Not resumed: " + e.message, true); });
    };
  });
  var mf = document.getElementById("manifest");
  if (mf) mf.onchange = function () {
    var f = mf.files[0]; if (!f) return;
    if (S.demo) { S.relErr = "Demo mode: releases cannot be added."; render(); return; }
    f.arrayBuffer().then(function (buf) { return api("/api/releases", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: buf }); })
      .then(function () { S.relErr = ""; toast("Release registered"); refresh(); }).catch(function (e) { S.relErr = e.message; toast(e.message, true); render(); });
  };
}
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sel && S.token) { e.preventDefault(); closeDevice(); } });
try { var saved = sessionStorage.getItem("cortex-token"); if (saved) { S.token = saved; start(); } else render(); } catch (e) { render(); }
</script>
</body>
</html>
