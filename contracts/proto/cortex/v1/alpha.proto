syntax = "proto3";
package cortex.v1;
option go_package = "github.com/asirive/cortex/gateway/internal/gen/cortex/v1;cortexv1";

// ALPHA-ONLY. These messages are compiled into alpha device builds only.
// The gateway rejects them from any device whose Hello tier != ALPHA or whose
// bench_device flag is false. Production builds do not contain the handlers, so
// they cannot be enabled remotely.

message DebugCommand {
  string command_id = 1;
  string name = 2;                 // "restart_service", "set_log_level", "dump_state", "reboot"
  map<string, string> args = 3;
  // Signed so a device can refuse replayed, misdirected or stale commands.
  // signature = ed25519(command key, deterministic proto bytes of this message with signature empty).
  // Device MUST check: signature, device_id == own id, now < expires_ms (issued_ms..expires_ms <= 60 s),
  // and nonce never seen before (keep the last 256).
  string device_id = 4;
  int64 issued_ms = 5;
  int64 expires_ms = 6;
  bytes nonce = 7;
  string issuer = 8;               // operator name, for the device log
  bytes signature = 9;
}

message DebugResult {
  string command_id = 1;
  bool ok = 2;
  string output = 3;
}

// Live camera relay for bench debugging. OFF by default, per-session, shown by
// an indicator on the device. Frames are relayed to a logged-in dashboard
// viewer and are NEVER written to disk or database by the gateway.
message CameraControl {
  bool enable = 1;
  uint32 max_fps = 2;
  uint32 session_ttl_s = 3;
}

message CameraFrame {
  uint64 frame_id = 1;
  string codec = 2;   // "jpeg"
  bytes data = 3;
}

// Training-data capture, a separate pipeline from telemetry. Requires:
// bench_device = true AND an explicit consent record for the capture session.
// Chunks are stored in the dataset store (see docs/architecture/V4-ECOSYSTEM.md
// section 9), never in the telemetry database, and carry no account identity.
message DatasetControl {
  bool enable = 1;
  string session_id = 2;
  string consent_ref = 3;       // id of the consent record
  repeated string streams = 4;  // "video", "tof", "audio", "imu", "gps"
  uint32 max_session_s = 5;
}

message DatasetChunk {
  string session_id = 1;
  string stream = 2;
  uint64 chunk_index = 3;
  int64 start_ts_ms = 4;
  bytes data = 5;
  bytes sha256 = 6;
}
