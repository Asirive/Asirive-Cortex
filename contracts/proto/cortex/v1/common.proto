syntax = "proto3";
package cortex.v1;
option go_package = "github.com/asirive/cortex/gateway/internal/gen/cortex/v1;cortexv1";

// Access tier of a device. Decides which message sets the gateway accepts and
// which the device build even contains. Production builds do not compile in
// the alpha-only messages (alpha.proto).
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_ALPHA = 1;   // team bench: full logs, debug, camera relay, dataset capture
  TIER_BETA = 2;    // opted-in users: health, trimmed logs, feedback, OTA
  TIER_STABLE = 3;  // everyone: health, versions, feedback, OTA
}

// Update ring. Mirrors Tier today but is kept separate: a beta user can be
// pinned to stable, an alpha device can test a stable build.
enum Ring {
  RING_UNSPECIFIED = 0;
  RING_ALPHA = 1;
  RING_BETA = 2;
  RING_STABLE = 3;
}

// Present on every message. Replay protection = (device_id, seq) must be
// strictly increasing within a session AND ts_ms within the allowed window.
message Header {
  uint32 schema_version = 1;  // bump on breaking change; never edit in place
  string device_id = 2;
  uint64 seq = 3;
  int64 ts_ms = 4;            // wall clock, ms since epoch
  bytes nonce = 5;            // AEAD nonce when payload is sealed
}

enum PayloadType {
  PAYLOAD_TYPE_UNSPECIFIED = 0;
  PAYLOAD_TYPE_HELLO = 1;
  PAYLOAD_TYPE_HELLO_ACK = 2;
  PAYLOAD_TYPE_HEARTBEAT = 3;
  PAYLOAD_TYPE_ACK = 4;
  PAYLOAD_TYPE_GOODBYE = 5;
  PAYLOAD_TYPE_CLAIM_REQUEST = 6;
  PAYLOAD_TYPE_CLAIM_RESULT = 7;
  PAYLOAD_TYPE_OTA_OFFER = 10;
  PAYLOAD_TYPE_OTA_PROGRESS = 11;
  PAYLOAD_TYPE_OTA_RESULT = 12;
  PAYLOAD_TYPE_LOG_BATCH = 20;
  PAYLOAD_TYPE_FEEDBACK = 21;
  PAYLOAD_TYPE_EVENT = 22;
  // Alpha-only range. Gateway rejects these from non-alpha devices.
  PAYLOAD_TYPE_DEBUG_COMMAND = 100;
  PAYLOAD_TYPE_DEBUG_RESULT = 101;
  PAYLOAD_TYPE_CAMERA_CONTROL = 102;
  PAYLOAD_TYPE_CAMERA_FRAME = 103;
  PAYLOAD_TYPE_DATASET_CONTROL = 104;
  PAYLOAD_TYPE_DATASET_CHUNK = 105;
}

// Wire unit. payload is the serialized message named by type; in production
// it is AEAD-sealed end to end (device key <-> gateway/dashboard key) so the
// phone relay and any proxy see only ciphertext. tag authenticates header+payload.
message Envelope {
  Header header = 1;
  PayloadType type = 2;
  bytes payload = 3;
  bytes tag = 4;
}
